name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/tinkerius/brewberrypi-app

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make lint
      - run: make test
      - run: make build

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5

      - name: Release tag must match the project version
        if: env.RELEASE == 'true'
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] \
            || { echo "tag $GITHUB_REF_NAME is not v1.2.3 or v1.2.3-alpha.N/-beta.N/-rc.N"; exit 1; }
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release needs the Cloud Sync Google client
        if: env.RELEASE == 'true'
        env:
          CLIENT_ID: ${{ vars.GOOGLE_DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
        run: |
          test -n "$CLIENT_ID" -a -n "$CLIENT_SECRET" || {
            echo "variable GOOGLE_DRIVE_CLIENT_ID or secret GOOGLE_DRIVE_CLIENT_SECRET missing: a release would ship without Cloud Sync"
            exit 1
          }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always build linux/arm64 (device) + linux/amd64 (simulation) to validate the Containerfile.
      # Release tags (v*) additionally push, sign and verify.
      - name: Build (and push on release)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64,linux/amd64
          build-args: VERSION=${{ env.VERSION || '0.0.0-ci' }}
          # The Cloud Sync Google client (docs/deployment/cloud-sync-google.md); empty for forks.
          secrets: |
            google_drive_client_id=${{ vars.GOOGLE_DRIVE_CLIENT_ID }}
            google_drive_client_secret=${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          tags: ${{ env.RELEASE == 'true' && format('{0}:{1}', env.IMAGE, env.VERSION) || format('{0}:ci', env.IMAGE) }}
          push: ${{ env.RELEASE == 'true' }}

      - name: Install cosign v2 (Podman 5.4 cannot read cosign v3 signatures)
        if: env.RELEASE == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.0

      - name: Sign
        if: env.RELEASE == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY" || { echo "COSIGN_PRIVATE_KEY secret missing: refusing to publish an unsigned release"; exit 1; }
          cosign sign --yes --recursive --tlog-upload=false --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

      - name: Verify against the device policy
        if: env.RELEASE == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -v "$PWD/deploy/signing:/signing:ro" quay.io/skopeo/stable:v1.18.0 \
            --policy /signing/policy.json --registries.d /signing/registries.d \
            copy --src-creds "${{ github.actor }}:$GHCR_TOKEN" \
            "docker://$IMAGE@$DIGEST" dir:/tmp/verify

  # A version tag (v1.2.3) makes a draft release: it is published by hand once the hardware test
  # protocol (docs/deployment/hardware-test-protocol.md) has passed. A pre-release tag (v1.2.3-alpha.1,
  # -beta.N, -rc.N) is published at once as a GitHub pre-release, never "Latest", with a warning that
  # it is untested. Same scheme as tinkerius/brewberrypi-os.
  release:
    name: GitHub release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PRERELEASE_NOTES: |
            > [!WARNING]
            > **Pre-release: not yet tested on hardware.** It builds and passes CI, but the hardware
            > test protocol (docs/deployment/hardware-test-protocol.md) has not been run on this image.
            > Never connect a mains heater: use LEDs or the relay board on its own.
            > Installing it on BrewberryPi OS needs an OS version that accepts pre-release app versions
            > (runtime contract §1).
        run: |
          version=${TAG#v}
          notes="Image: \`$IMAGE:$version\` (\`$IMAGE@$DIGEST\`), linux/arm64 and linux/amd64, signed with the key in deploy/signing/cosign.pub."
          case $TAG in
             v*-*) mode=(--prerelease --latest=false); notes="$PRERELEASE_NOTES"$'\n'"$notes" ;;
             *)    mode=(--draft) ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${mode[@]}" \
            --title "BrewberryPi $TAG" --generate-notes --notes "$notes"
