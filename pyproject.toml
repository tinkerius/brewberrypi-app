[project]
name = "brewberrypi"
version = "0.1.0-alpha.10"
description = "Raspberry Pi controller for a home-brewing mash kettle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastjsonschema>=2.22.2",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
brewberrypi = "brewberrypi.__main__:main"
brewberrypi-temperature-logger = "brewberrypi.tools:temperature_logger"
brewberrypi-gpio-test = "brewberrypi.tools:gpio_test"
brewberrypi-sensor-test = "brewberrypi.tools:sensor_test"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brewberrypi"]
# The front end is built by Vite into this (git-ignored) folder and shipped inside the wheel.
artifacts = ["src/brewberrypi/web/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]

[tool.ruff.lint.per-file-ignores]
# Tests compare against the literal values of the specification.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fastjsonschema", "gpiod", "gpiod.*"]
ignore_missing_imports = true
